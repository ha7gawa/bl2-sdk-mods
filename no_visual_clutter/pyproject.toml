[project]
name = "no_visual_clutter"
version = "1.0.0"
authors = [{ name = "ha7gawa" }]
description = """\
Sliders to shrink or fade particle effects by category: grenades, shields, tracers and E-Tech \
beams, surface impacts, explosions, muzzle flashes, loot icons and beams, on-screen elemental \
effects and action skills.

Settings apply instantly. If some effects in a newly loaded area are unchanged, press \
Re-Scan Packages. Disabling the mod restores the original effects.
"""

[project.urls]
Homepage = "https://github.com/ha7gawa/bl2-sdk-mods"

[tool.sdkmod]
name = "No Visual Clutter"
version = "1.0"
license = { name = "GPL3", url = "https://choosealicense.com/licenses/gpl-3.0/" }
supported_games = ["BL2"]
coop_support = "ClientSide"
