[project]
name = "paced_loot_multiplier"
version = "1.0.0"
authors = [{ name = "ha7gawa" }, { name = "juso40" }]
description = """\
Multiplies the loot every enemy drops on death.

Based on juso40's Drop Chance Multiplier. Instead of dropping everything in a single frame, the \
extra drops are queued and released over several network ticks, so high multipliers don't freeze \
the game or desync co-op clients. Only the host needs it.

Options: Drop Multiplier, drops per enemy per tick, delay between ticks.
"""

[project.urls]
Homepage = "https://github.com/ha7gawa/bl2-sdk-mods"
Original = "https://github.com/juso40/bl2sdk_Mods/tree/master/DropChanceMultiplier"

[tool.sdkmod]
name = "Paced Loot Multiplier"
version = "1.0"
license = { name = "GPL3", url = "https://choosealicense.com/licenses/gpl-3.0/" }
supported_games = ["BL2"]
coop_support = "HostOnly"
